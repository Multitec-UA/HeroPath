# HeroPath configuration.
# Restart the server (or reload the plugin) after changing it.

# Which local day a sample belongs to. History is filed per day, and the web map shows
# times of day in this zone.
timezone: 'Europe/Madrid'

history:
  # How often to read every player's position, in ticks (20 ticks = 1 second).
  samplingTicks: 100
  # A position is only written when the player moved at least this far since the last one,
  # so standing still writes nothing...
  minMoveBlocks: 2.0
  # ...except once every keepAliveSeconds, so the timeline still knows they were there.
  keepAliveSeconds: 60
  # A move longer than this between two samples was not walked (teleport, nether portal,
  # ender pearl, death). The map does not draw a line across it.
  jumpDistance: 64.0
  # Delete history older than this many days. 0 keeps it forever.
  keepDays: 0

web:
  # Days of history published to the web map (the files on disk are kept regardless).
  days: 30
  # How often the web files are rewritten, in seconds.
  exportSeconds: 300

# The BMTrails part: the last minute or so of each online player, drawn live.
live:
  enabled: true
  # Number of samples in the live trail. With samplingTicks 100 (5 s), 36 points = 3 minutes.
  points: 36
  lineWidth: 3
  markerSetName: 'Live trails'
  visibleByDefault: true
