plugins {
    id 'java'
}

group = 'com.multitec'
version = '2.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven {
        url = 'https://repo.bluecolored.de/releases'
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

dependencies {
    // Pinned to the exact Paper build the server runs (PAPER_BUILD in MT-Minecraft's
    // compose). The server is pinned, so the plugin is compiled against the same API.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.115-stable'
    // The API version BlueMap 5.23 serves; 2.7.x is what the chunk-trimmer addon already
    // runs against on this server.
    compileOnly 'de.bluecolored:bluemap-api:2.7.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    // Only to check that what the exporter writes is valid JSON a browser can parse.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
